<title>Robust Management of Long-Running Computational Processes: A Case Study with MadGraph</title>
<meta name="description" content="In high-energy physics and beyond, computational workflows often rely on extensive event generators such as MadGraph5_aMC@NLO. These simulations may run for days, weeks or event months, consuming significant system resources. To ensure reproducibility, fault tolerance, and effective resource utilisation, it is imperative to launch such processes in a detached, non-interactive manner while preserving the ability to monitor, log, and, if necessary, terminate them cleanly. This note discusses the practical aspects of process management in a Unix-like environment, focusing on the use of nohup, background job control, process groups, and a self-contained launcher script that encapsulates these mechanisms.">
