    <meta name="description" content="In high-energy physics and beyond, computational workflows often rely on extensive event generators such as MadGraph5_aMC@NLO. These simulations may run for days, weeks or event months, consuming significant system resources. To ensure reproducibility, fault tolerance, and effective resource utilisation, it is imperative to launch such processes in a detached, non-interactive manner while preserving the ability to monitor, log, and, if necessary, terminate them cleanly. This note discusses the practical aspects of process management in a Unix-like environment, focusing on the use of nohup, background job control, process groups, and a self-contained launcher script that encapsulates these mechanisms.">

    <!-- Markdown & Highlighting Styles (self-hosted, see /vendor). These three

         none of them is needed for the first paint, so they are fetched as print
         CSS and promoted once they land. They are same-origin now, but a slow

    <link rel="stylesheet" href="/vendor/prism-tomorrow.min.css" media="print"
          onload="this.media='all'" onerror="this.media='all';console.warn('Code theme failed to load')">

    <!-- KaTeX styles are not requested here. Its webfont pack is too large to

    <!-- Deferred scripts execute in document order, so this queue carries the
         article's hard dependencies and nothing optional: marked and js-yaml
         first (the body cannot be split or rendered without them), then Prism with
         its grammars, in dependency order. KaTeX is cross-origin and cosmetic,
         so it is requested on demand in the page script: one stalled request
         there can no longer hold back the queue. -->
    <!-- `onerror` is set on the tags themselves, not by the page script, because a
         refused request can dispatch its error event before that script runs. The
         attribute records it; /styles/post.js reads the record and reports it. -->
    <script defer data-vendor="marked" src="/vendor/marked.min.js" onerror="this.dataset.failed='1'"></script>
