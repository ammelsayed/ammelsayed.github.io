<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    
    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="Blog Post" id="og-title">
    <meta property="og:description" content="Blog Post" id="og-description">
    <meta property="og:url" content="">
    <meta property="og:type" content="article">
    <meta property="og:image" content="">
    
    <link rel="icon" href="/images/tap-icon.png">
    
    <!-- Global Theme Styles -->
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="stylesheet" href="/styles/blog-post.css">

    <!-- Markdown & Highlighting Styles (self-hosted, see /vendor). These three
         style optional features - code colours, comments, share buttons - and
         none of them is needed for the first paint, so they are fetched as print
         CSS and promoted once they land. They are same-origin now, but a slow
         request still should not hold the article text back. -->
    <link rel="stylesheet" href="/vendor/prism-tomorrow.min.css" media="print" onload="this.media='all'">

    <!-- Comments section (styles only; the client itself loads on demand) -->
    <link rel="stylesheet" href="/vendor/waline.css" media="print" onload="this.media='all'">

    <!-- Overtrue Share.js - professional sharing library with WeChat/QQ support -->
    <link rel="stylesheet" href="/vendor/social-share/share.min.css" media="print" onload="this.media='all'">

    <!-- KaTeX styles. Its webfont pack is too large to vendor, so KaTeX stays
         on jsDelivr; only one copy is loaded now. It is also no longer
         render-blocking: loaded as print CSS and promoted to screen once it
         arrives, so a slow CDN cannot hold back the first paint. The formulas
         are typeset later anyway, and the noscript copy covers no-JS readers. -->
    <link rel="stylesheet" id="katex-css" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
          media="print" onload="this.media='all'"
          onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.16.8/dist/katex.min.css';this.media='all'">
    <script>
        // A request that stalls fires neither `load` nor `error`, so the print
        // stylesheet would never be promoted and formulas would render unstyled.
        // After five seconds the fallback host is used instead; the primary href
        // is gone by then, so a late answer cannot override it.
        setTimeout(function () {
            var link = document.getElementById('katex-css');
            if (!link || link.media === 'all') return;
            link.href = 'https://unpkg.com/katex@0.16.8/dist/katex.min.css';
            link.media = 'all';
        }, 5000);
    </script>
    <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"></noscript>
</head>
<body>
    <my-header></my-header>
    <script type="module" src="/styles/header.js"></script>
    <script src="/menu.js"></script>

    <main>
        <div class="blog-post-wrapper">
            <div id="toc-container" class="toc-container" style="display: none;">
                <h3>Contents</h3>
                <nav id="toc-content"></nav>
            </div>

            <div class="post-main-container">
                <div class="post-header-section">
                    <h1 id="post-title">Loading...</h1>
                    <div id="post-meta" class="post-meta">
                        <!-- Populated by JS -->
                    </div>
                    
                </div>

                <article id="post-content" class="blog-post-content">
                    <p>Loading content...</p>
                </article>

                <div style="border-top: 1px solid var(--border-color);">
                    <h3 style="font-size: 18px; margin-bottom: 15px;"> Share this article:</h3>
                    <div class="social-share" id="social-share-container"></div>
                </div>

                <div id="waline"></div>

            </div>
        </div>
    </main>

    <script src="/styles/utils.js"></script>
    <my-footer></my-footer>
    <script type="module" src="/styles/footer.js"></script>

    <!-- Deferred scripts execute in document order, so the order here is the
         dependency order, and only same-origin files are in it: marked and js-yaml
         (the article cannot start without them), then the share bundle, then Prism
         with its grammars. KaTeX is the one cross-origin dependency left and is
         requested on demand further down, because a stalled CDN request inside this
         queue would hold back every script behind it. -->
    <script defer data-vendor="marked" src="/vendor/marked.min.js"></script>
    <script defer data-vendor="js-yaml" src="/vendor/js-yaml.min.js"></script>
    <script defer data-vendor="social-share" src="/vendor/social-share/social-share.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-clike.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-javascript.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-python.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-bash.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-c.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-cpp.min.js"></script>

    <script>
        function formatPostDate(value) {
            if (!value) return '';
            if (value instanceof Date) {
                return value.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
            }
            return String(value);
        }

        // Resolves with `true` as soon as `test()` is true, or `false` after
        // `timeoutMs`. Everything on this page is deferred, so the libraries are
        // still on their way when this inline script runs. Waiting for
        // DOMContentLoaded waits for all of them - KaTeX included - which is what
        // kept the article on "Loading content..." while they downloaded.
        // The poll backs off (25 ms up to 400 ms) so a slow library costs nothing.
        function whenAvailable(test, timeoutMs = 45000) {
            return new Promise(resolve => {
                if (test()) {
                    resolve(true);
                    return;
                }
                const started = Date.now();
                let delay = 25;
                const tick = () => {
                    if (test()) {
                        resolve(true);
                        return;
                    }
                    if (Date.now() - started > timeoutMs) {
                        resolve(false);
                        return;
                    }
                    setTimeout(tick, delay);
                    delay = Math.min(delay * 2, 400);
                };
                setTimeout(tick, delay);
            });
        }

        // A wait that expires is not a verdict: a slow library is still usable when
        // it finally lands, so `retryUntil` keeps looking on a slow timer instead of
        // abandoning the feature for the rest of the visit.
        function retryUntil(test, run, everyMs = 5000, giveUpMs = 300000) {
            const started = Date.now();
            const timer = setInterval(() => {
                if (test()) {
                    clearInterval(timer);
                    run();
                } else if (Date.now() - started > giveUpMs) {
                    clearInterval(timer);
                    console.warn('A library never arrived; part of this page stays unavailable.');
                }
            }, everyMs);
        }

        // Both libraries are required and both are same-origin, declared before
        // anything optional. Waiting for them here means `splitFrontMatter` always
        // has a real YAML parser, so no fallback parser and no second wait.
        const libsReady = () => window.marked
            && typeof window.marked.parse === 'function'
            && window.jsyaml
            && typeof window.jsyaml.load === 'function';

        // Guard against a retry starting a second render while an earlier attempt
        // is still waiting for the same libraries.
        let booted = false;
        let attempts = 0;
        let requiredFailed = false;

        // A refused request never defines its global, so polling would wait for
        // something that is not coming. The browser reports the failure at once, so
        // the page says so at once instead of spending three waits on it.
        const reportRequiredFailure = (src) => {
            if (requiredFailed) return;
            requiredFailed = true;
            const contentEl = document.getElementById('post-content');
            if (!contentEl || booted) return;
            // Name the file that failed: "a required script" tells the visitor
            // nothing, and the console already has the request.
            const file = String(src || '').split('/').pop() || 'a required script';
            contentEl.textContent = `The article could not be loaded: ${file} failed to load. `;
            const reload = document.createElement('a');
            reload.href = window.location.href;
            reload.textContent = 'Reload the page';
            contentEl.appendChild(reload);
        };

        ['marked', 'js-yaml'].forEach(name => {
            const script = document.querySelector(`script[data-vendor="${name}"]`);
            if (script) script.addEventListener('error', () => reportRequiredFailure(script.src));
        });

        // KaTeX is requested here rather than in the document's deferred queue: a
        // stalled CDN request in that queue would hold back Prism and everything
        // behind it. Core first, its auto-render extension second, and the page is
        // complete without either.
        const loadScript = (src, onLoad) => {
            const script = document.createElement('script');
            script.src = src;
            script.onload = onLoad || (() => {});
            script.onerror = () => console.warn('KaTeX part failed to load:', src);
            document.head.appendChild(script);
        };
        const loadKatex = () => {
            if (window.katex || loadKatex.started) return;
            loadKatex.started = true;
            loadScript('https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js', () => {
                loadScript('https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js');
            });
        };

        async function startPost() {
            // The wait is checked rather than left to throw, so a slow library shows
            // a message instead of an exception.
            const rendererReady = await whenAvailable(libsReady);

            if (!rendererReady) {
                const contentEl = document.getElementById('post-content');
                if (requiredFailed) return;
                attempts += 1;
                if (attempts >= 3) {
                    // Slow is recoverable, refused is not. After three waits say so
                    // and stop: nothing is rescheduled, so no timer keeps running and
                    // no message keeps changing under the reader.
                    contentEl.textContent = 'The article could not be loaded because a required script failed. ';
                    const reload = document.createElement('a');
                    reload.href = window.location.href;
                    reload.textContent = 'Reload the page';
                    contentEl.appendChild(reload);
                    return;
                }
                contentEl.textContent = 'Still loading the libraries this page needs...';
                // A plain timer, not `retryUntil`: that helper only runs its callback
                // once readiness is true, which is exactly what cannot happen when
                // the script itself failed.
                setTimeout(startPost, 5000);
                return;
            }

            // Several attempts can be waiting on the same libraries at once; only
            // the first one through renders, so the post is fetched and wired once.
            if (booted) return;
            booted = true;

            const urlParams = new URLSearchParams(window.location.search);
            let postId = urlParams.get('id');
            if (!postId) {
                document.getElementById('post-content').innerHTML = '<p>Error: No post ID provided.</p>';
                return;
            }

            try {
                const mdRes = await fetch(`/blog/${encodeURIComponent(postId)}.md?t=${Date.now()}`);
                if (!mdRes.ok) throw new Error('Post not found');
                const raw = await mdRes.text();
                // Front matter is split here rather than by `parseFrontMatter`, whose
                // `ensureYamlParser` injects a jsDelivr script - the one dependency
                // this change exists to remove. `libsReady` has already established
                // the local parser, so there is no second wait and no fallback parser:
                // the delimiter is line-anchored and whitespace-tolerant, then
                // js-yaml does the rest.
                const splitFrontMatter = (text) => {
                    const match = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)([\s\S]*)$/);
                    if (!match) return { data: {}, content: text };
                    let data = {};
                    try {
                        data = window.jsyaml.load(match[1]) || {};
                    } catch (error) {
                        console.warn('Front matter is not valid YAML:', error);
                    }
                    return { data, content: match[2] };
                };
                const frontMatter = splitFrontMatter(raw);
                const postData = frontMatter.data || {};
                const markdown = frontMatter.content || '';

                // Initialize Marked with GFM
                marked.setOptions({
                    gfm: true,
                    breaks: true,
                    highlight: function(code, lang) {
                        if (window.Prism && Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    langPrefix: 'language-'
                });

                // Post images sit below the first screen. DOMParser returns an
                // inert document: an <img> there never starts a request, whereas
                // the children of a detached <div> begin loading the moment they
                // get a src. Decorate them there, then import the nodes, which is
                // the first moment they are visible to the loader at all: the url
                // travels in data-src and is promoted only after insertion, so the
                // hints are already on the element when the request can start.
                const contentEl = document.getElementById('post-content');
                // Image urls leave the html before any parser sees it: they are
                // carried in data-src, so not even the parse can start a request.
                // Raw HTML in Markdown is written by post authors on a static site,
                // so anything executable in it would run with the visitor's own
                // session: only the tags below survive, event handlers and
                // resource-bearing attributes (srcset, style, poster) are removed,
                // and every url must be http(s), mailto, an anchor or relative.
                // Keeping SVG, video/audio or srcset "just in case" is how the
                // exotic escapes appear (an SVG <animate> rewriting an href, a
                // srcset entry that never went through the check), so they go.
                const ALLOWED_TAGS = new Set([
                    'P', 'BR', 'DIV', 'SPAN', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6',
                    'UL', 'OL', 'LI', 'DL', 'DT', 'DD', 'STRONG', 'B', 'EM', 'I',
                    'U', 'S', 'SMALL', 'SUP', 'SUB', 'MARK', 'CITE', 'ABBR', 'TIME',
                    'CODE', 'PRE', 'BLOCKQUOTE', 'HR', 'A', 'IMG', 'FIGURE',
                    'FIGCAPTION', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH',
                    'CAPTION', 'DETAILS', 'SUMMARY', 'DEL', 'INS', 'KBD'
                ]);
                const DROPPED_ATTRS = new Set(['srcset', 'sizes', 'style', 'poster', 'autoplay', 'loop', 'controls', 'formaction', 'action', 'background', 'ping']);

                // A url is kept if it is http(s), mailto, an anchor, or relative. A
                // backslash is refused (the browser folds it into a slash, turning
                // "/\host" into a protocol-relative url) and so is "//host" and any
                // other scheme, javascript: and data: included.
                function safeAttrUrl(value) {
                    const url = String(value || '').trim();
                    if (!url || url.includes('\\') || url.startsWith('//')) return false;
                    if (/^(?:https?:|mailto:|#)/i.test(url)) return true;
                    return !/^[a-z][a-z0-9+.-]*:/i.test(url);
                }

                function sanitizeTree(root) {
                    root.querySelectorAll('*').forEach(node => {
                        if (!ALLOWED_TAGS.has(node.tagName.toUpperCase())) {
                            node.remove();
                            return;
                        }
                        Array.from(node.attributes).forEach(attr => {
                            const name = attr.name.toLowerCase();
                            if (name.startsWith('on') || DROPPED_ATTRS.has(name)) {
                                node.removeAttribute(attr.name);
                                return;
                            }
                            if (name === 'src' && node.tagName.toUpperCase() === 'IMG') {
                                // The url is moved here, in the tree, not in the html
                                // string: an example that merely mentions src= keeps
                                // its text, and one attribute at a time is handled.
                                if (safeAttrUrl(attr.value)) node.setAttribute('data-src', attr.value.trim());
                                node.removeAttribute('src');
                                return;
                            }
                            if (name === 'href' || name === 'src' || name === 'xlink:href') {
                                if (!safeAttrUrl(attr.value)) node.removeAttribute(attr.name);
                            }
                        });
                    });
                }

                const html = marked.parse(markdown);
                const parsed = new DOMParser().parseFromString(html, 'text/html');
                sanitizeTree(parsed.body);

                parsed.querySelectorAll('img').forEach(img => {
                    img.setAttribute('decoding', 'async');
                });

                contentEl.replaceChildren(
                    ...Array.from(parsed.body.childNodes, node => document.importNode(node, true))
                );

                // An image whose size the markup declares keeps a reserved box, so it
                // gets the lazy hint and nothing can move when it arrives. One without
                // dimensions is not deferred at all: a deferred unsized image is what
                // makes a reader's position jump, so it loads the way it did before
                // this change. The urls are handed over only here, after insertion, so
                // no request can start from parsing.
                contentEl.querySelectorAll('img[data-src]').forEach(img => {
                    const src = img.getAttribute('data-src');
                    // The attribute was already checked in the tree, and is checked
                    // again here: promotion is the last moment before a request.
                    if (!src || !safeAttrUrl(src)) {
                        img.removeAttribute('data-src');
                        return;
                    }
                    img.setAttribute('loading', 'lazy');
                    img.removeAttribute('data-src');
                    img.src = src;
                });
                // Process GitHub-style Alerts - FIXED for proper spacing!
                processGitHubAlerts(contentEl);
                
                // Wrap code blocks in a wrapper for fixed copy button
                document.querySelectorAll('pre').forEach(pre => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-block-wrapper';
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(pre);

                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.innerText = 'Copy';
                    wrapper.appendChild(btn);
                    btn.addEventListener('click', async () => {
                        await navigator.clipboard.writeText(pre.querySelector('code').innerText);
                        btn.innerText = 'Copied';
                        btn.classList.add('copied');
                        setTimeout(() => { btn.innerText = 'Copy'; btn.classList.remove('copied'); }, 2000);
                    });
                });

                // Highlighting itself is wired up outside this function, before the
                // fetch starts, so no grammar can land unnoticed. This only runs the
                // first pass once the core is up; later grammars trigger their own.
                whenAvailable(() => window.Prism
                    && typeof window.Prism.highlightAllUnder === 'function')
                    .then(() => {
                        if (!window.Prism || typeof window.Prism.highlightAllUnder !== 'function') {
                            console.warn('Prism did not load; code blocks stay plain.');
                            return;
                        }
                        highlightCode();
                    });

                // Generate Table of Contents
                const tocContainer = document.getElementById('toc-container');
                const tocContent = document.getElementById('toc-content');
                const headings = contentEl.querySelectorAll('h2, h3');
                const updateTocVisibility = () => {
                    const shouldShowToc = window.innerWidth > 1024 && headings.length > 0;
                    tocContainer.style.display = shouldShowToc ? 'block' : 'none';
                };
                
                if (headings.length > 0) {
                    const tocList = document.createElement('ul');
                    headings.forEach((heading, index) => {
                        const id = `heading-${index}`;
                        heading.id = id;
                        
                        const li = document.createElement('li');
                        li.className = heading.tagName.toLowerCase();
                        const a = document.createElement('a');
                        a.href = `#${id}`;
                        a.textContent = heading.textContent;
                        li.appendChild(a);
                        tocList.appendChild(li);
                    });
                    tocContent.appendChild(tocList);
                }

                updateTocVisibility();
                window.addEventListener('resize', updateTocVisibility);

                // Force theme background
                const updatePostTheme = () => {
                    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                    document.body.style.backgroundColor = 'var(--background-color)';
                };
                updatePostTheme();
                
                const observer = new MutationObserver(updatePostTheme);
                observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

                // Set Title
                const h1InContent = contentEl.querySelector('h1');
                const titleText = h1InContent ? h1InContent.innerText : 'Blog Post';
                document.getElementById('post-title').innerText = titleText;
                document.title = titleText + ' | Blog';

                // Update Open Graph for sharing
                document.getElementById('og-title').content = titleText;
                
                // Get first paragraph for description
                const firstPara = contentEl.querySelector('p');
                const desc = firstPara ? firstPara.innerText.slice(0, 200) : 'Read this blog post';
                document.getElementById('og-description').content = desc;
                document.querySelector('meta[property="og:url"]').content = window.location.href;

                // Get first image for sharing
                const firstImg = contentEl.querySelector('img');
                let imageUrl = '';
                if (firstImg) {
                    // The url may still be in data-src before the promotion loop
                    // has run; either way the share metadata gets a real url.
                    imageUrl = firstImg.getAttribute('data-src') || firstImg.src;
                    document.querySelector('meta[property="og:image"]').content = imageUrl;
                }

                // Set Metadata
                const metaEl = document.getElementById('post-meta');
                if (postData) {
                    const dateMeta = postData.meta ? postData.meta.find(m => m.icon === '🗓️' || /^[A-Za-z]+ \d{4}$/.test(m.text)) : null;
                    const dateText = formatPostDate(dateMeta ? dateMeta.text : postData.date);
                    const author = postData.author || {};
                    const badge = postData.badge || '';
                    
                    metaEl.innerHTML = `
                        ${author.image ? `<img src="${author.image}" alt="${author.name}">` : ''}
                        <span>By <a href="${author.link || '#'}" target="_blank">${author.name || 'Author'}</a></span>
                        ${dateText ? `<span class="divider">/</span> <span>${dateText}</span>` : ''}
                        ${badge ? `<span class="divider">/</span> <span class="badge">${badge}</span>` : ''}
                        <span class="divider">/</span> Views: 
                    `;
                }

                const viewSpan = document.createElement('span');
                viewSpan.className = 'waline-pageview-count';
                viewSpan.setAttribute('data-path', `/blog/post/${postId}`);
                metaEl.appendChild(viewSpan);

                // Cosmetic extras: each is applied when its own library lands,
                // and neither holds up the render or the comments section. A late
                // library is still picked up by the retry, so a slow CDN delays the
                // feature instead of dropping it for the whole visit.
                const shareReady = () => typeof window.socialShare === 'function';
                const showShare = () => socialShare('#social-share-container', {
                    url: window.location.href,
                    title: titleText,
                    description: desc,
                    image: imageUrl,
                    sites: ['wechat', 'qq', 'weibo', 'facebook', 'twitter', 'linkedin'],
                    wechatQrcodeTitle: "WeChat Scan to Share"
                });
                whenAvailable(shareReady).then(ready => {
                    if (!ready) {
                        retryUntil(shareReady, showShare);
                        return;
                    }
                    showShare();
                });

                // KaTeX ships as two scripts: the core (which defines window.katex)
                // and the auto-render extension. The extension alone is useless, so
                // both have to be there before a pass is attempted.
                const mathReady = () => typeof window.renderMathInElement === 'function'
                    && typeof window.katex !== 'undefined';
                const typeset = () => {
                    try {
                        renderMathInElement(contentEl, {
                            delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false}
                            ],
                            throwOnError: false
                        });
                    } catch (error) {
                        // Formulas are decoration: a failure is reported here and the
                        // article is left with its source text, not an error page.
                        console.warn('Math rendering failed:', error);
                    }
                };
                loadKatex();
                whenAvailable(mathReady).then(ready => {
                    if (!ready) {
                        retryUntil(mathReady, typeset);
                        return;
                    }
                    typeset();
                });

                // A module that hangs (rather than failing) must not hold the
                // comments section open for ever: each import gets a deadline and
                // the rejection lands in the catch below, which reports it.
                const withDeadline = (promise, ms, label) => Promise.race([
                    promise,
                    new Promise((resolve, reject) => {
                        setTimeout(() => reject(new Error(`${label} did not load in time`)), ms);
                    })
                ]);

                try {
                    const { init } = await withDeadline(import('https://unpkg.com/@waline/client@v3/dist/waline.js'), 20000, 'Waline');
                    const katex  = await withDeadline(import('https://unpkg.com/katex@v0.16/dist/katex.mjs'), 20000, 'KaTeX');
                    init({
                        el: '#waline',
                        serverURL: 'https://commentsystem-amber.vercel.app/',
                        lang: 'en',
                        dark: document.documentElement.getAttribute('data-theme') === 'dark',
                        meta: ['nick'],
                        requiredMeta: [],
                        noCopyright: true,
                        noRss: true,
                        turnstileKey: false,
                        wordLimit:300,
                        pageview: true,
                        path: `/blog/post/${postId}`,
                        texRenderer: (blockMode, tex) =>
                        katex.renderToString(tex, {
                            displayMode: blockMode,
                            throwOnError: false,
                        }),
                    });
                } catch (error) {
                    console.error('Comment section unavailable:', error);
                }

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('post-content').innerHTML = `<p>Error loading post: ${error.message}</p>`;
            }
        }

        // Prism core and its grammars arrive as separate deferred scripts, and a
        // grammar is only useful once it is registered. The `load` listener lives
        // out here, before the article is fetched, so a grammar cannot finish
        // loading in the gap between the fetch and the first highlighting pass:
        // every grammar that lands, early or late, triggers a fresh pass.
        // prism-cpp builds on prism-c, which is loaded before it.
        const highlightCode = () => {
            const contentEl = document.getElementById('post-content');
            if (contentEl && window.Prism && typeof window.Prism.highlightAllUnder === 'function') {
                Prism.highlightAllUnder(contentEl);
            }
        };

        document.addEventListener('load', event => {
            const target = event.target;
            if (target && target.tagName === 'SCRIPT' && /\/vendor\/prism[-.]/.test(target.src || '')) {
                highlightCode();
            }
        }, true);

        startPost();

        function processGitHubAlerts(container) {
            container.querySelectorAll('blockquote').forEach(blockquote => {
                let alertType = null;
                
                // Find the alert type - look for [!TYPE] anywhere in the blockquote
                let alertFound = false;
                
                // Check all child nodes (text and p)
                for (let child of blockquote.childNodes) {
                    if (alertFound) break;
                    
                    if (child.nodeType === Node.TEXT_NODE) {
                        const text = child.textContent;
                        const match = text.match(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
                        if (match) {
                            alertType = match[1].toLowerCase();
                            // Replace the [!TYPE] with the proper styled title
                            child.textContent = text.replace(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i, '');
                            alertFound = true;
                        }
                    } else if (child.tagName === 'P') {
                        const html = child.innerHTML;
                        const match = html.match(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
                        if (match) {
                            alertType = match[1].toLowerCase();
                            // Clean up the p tag
                            child.innerHTML = html.replace(/\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i, '');
                            alertFound = true;
                        }
                    }
                }
                
                if (alertType) {
                    blockquote.classList.add('markdown-alert');
                    blockquote.classList.add(`markdown-alert-${alertType}`);
                }
            });
        }
    </script>
</body>
</html>
