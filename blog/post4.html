    <!-- Global Theme Styles -->
    <link rel="stylesheet" href="/styles/theme.css">
    <link rel="stylesheet" href="/styles/header.css">
    <link rel="stylesheet" href="/styles/footer.css">
    <link rel="stylesheet" href="/styles/blog-post.css">

    <!-- Markdown & Highlighting Styles (self-hosted, see /vendor). These three
         style optional features - code colours, comments, share buttons - and
         none of them is needed for the first paint, so they are fetched as print
         CSS and promoted once they land. They are same-origin now, but a slow
         request still should not hold the article text back. -->
    <link rel="stylesheet" href="/vendor/prism-tomorrow.min.css" media="print"
          onload="this.media='all'" onerror="this.media='all';console.warn('Code theme failed to load')">

    <!-- Comments section (styles only; the client itself loads on demand) -->
    <link rel="stylesheet" href="/vendor/waline.css" media="print"
          onload="this.media='all'" onerror="this.media='all';console.warn('Comment styles failed to load')">

    <!-- KaTeX styles are not requested here. Its webfont pack is too large to
         vendor, so the stylesheet is fetched from the same CDN as the KaTeX
         JavaScript, at the moment a post turns out to have formulas. Posts
         without maths, and every other page, never ask for it. -->
</head>
<body>
    <my-header></my-header>
    <script type="module" src="/styles/header.js"></script>
    <script src="/menu.js"></script>

    <main>
        <div class="blog-post-wrapper">
            <div id="toc-container" class="toc-container" style="display: none;">
                <h3>Contents</h3>
                <nav id="toc-content"></nav>
            </div>

            <!-- One loading state for the whole article. The page used to print
                 "Loading..." for a title, "Loading content..." for a body and an
                 empty SHARE row, so a reader watched three half-born parts of a
                 page. This block stands in for all of them, in the article's own
                 column and metrics, until the Markdown is on screen. -->
            <div class="post-loading" id="post-loading" role="status" aria-live="polite">
                <div class="post-loading-bar" data-line="title"></div>
                <div class="post-loading-bar" data-line="meta"></div>
                <div class="post-loading-bar" data-line="body"></div>
                <div class="post-loading-bar" data-line="body"></div>
                <div class="post-loading-bar" data-line="body"></div>
                <div class="post-loading-bar" data-line="body-short"></div>
                <p class="post-loading-text">Loading the article&hellip;</p>
            </div>

            <!-- Hidden until /styles/post.js has an article to show. The title,
                 the meta line, the share row and the comments are all part of
                 it, so nothing empty is ever on screen. `hidden` is flipped in
                 the same task that finishes the render: one step, no flash. -->
            <div class="post-main-container post-article" id="post-body" hidden>
                <div class="post-header-section">
                    <h1 id="post-title"></h1>
                    <div id="post-meta" class="post-meta">
                        <!-- Populated by JS -->
                    </div>
                    
                </div>

                <article id="post-content" class="blog-post-content"></article>

                <div class="post-share" id="post-share">
                    <div class="post-share-left">
                        <span class="post-share-label">Share</span>
                        <div class="post-share-actions" id="post-share-actions"></div>
                    </div>
                    <div class="post-like" id="post-like"></div>
                </div>

                <div id="waline"></div>

            </div>
        </div>
    </main>

    <script src="/styles/utils.js"></script>
    <my-footer></my-footer>
    <script type="module" src="/styles/footer.js"></script>

    <!-- Deferred scripts execute in document order, so this queue carries the
         article's hard dependencies and nothing optional: marked and js-yaml
         first (the body cannot be split or rendered without them), then Prism with
         its grammars, in dependency order. KaTeX is cross-origin and cosmetic,
         so it is requested on demand in the page script: one stalled request
         there can no longer hold back the queue. -->
    <!-- `onerror` is set on the tag itself, not by /styles/post.js, because a
         refused request can dispatch its error event before that file runs. The
         attribute records it; the script reads the record and reports it. -->
    <script defer data-vendor="marked" src="/vendor/marked.min.js" onerror="this.dataset.failed='1'"></script>
    <script defer data-vendor="js-yaml" src="/vendor/js-yaml.min.js" onerror="this.dataset.failed='1'"></script>
    <script defer data-vendor="prism" src="/vendor/prism.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-clike.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-javascript.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-python.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-bash.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-c.min.js"></script>
    <script defer data-vendor="prism" src="/vendor/prism-cpp.min.js"></script>

    <!-- The last resort, and deliberately outside /styles/post.js: a script that
         fails to parse cannot report its own failure, and the page would then sit
         on the skeleton with no way out but a reload the reader has to guess.
         If the article does arrive later it replaces this whole block anyway. -->
    <script>
        setTimeout(function () {
            if (document.documentElement.dataset.postState) return;
            var box = document.getElementById('post-loading');
            if (!box) return;
            var note = document.createElement('p');
            note.className = 'post-loading-text is-error';
            note.textContent = 'This article did not load. ';
            var reload = document.createElement('a');
            reload.href = window.location.href;
            reload.textContent = 'Reload the page';
            note.appendChild(reload);
            box.appendChild(note);
        }, 15000);
    </script>
    <script>window.POST_ID = "post4";</script>
    <script src="/styles/post.js"></script>
</body>
<!-- generated by scripts/build-share-pages.rb -->
</html>
