name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate blog index
        run: ruby scripts/build-blog-index.rb
      - name: Generate structured content (YAML -> JSON)
        run: ruby scripts/build-content-json.rb
      - name: Generate the search index
        run: ruby scripts/build-search-index.rb
      - name: Prepare static artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='_site' ./ _site/
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
