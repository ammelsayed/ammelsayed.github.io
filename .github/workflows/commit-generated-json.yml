name: Generate the content JSON

# The pages read their lists from data/*.json, which is generated from the YAML
# files and the blog front matter, and a link preview reads the tags on the
# article's own page. Both are committed here: GitHub Pages runs these scripts
# while it builds, but Cloudflare Pages publishes the repository as it stands,
# so anything either host serves has to be in it.
#
# Runs on every push to main. A commit pushed with the Actions token does not
# trigger another run, so this cannot loop on its own commits. One run at a time:
# two pushes a moment apart would otherwise write the same files, and the second
# would be pushed onto a branch that had moved.
on:
  push:
    branches: ["main"]

concurrency:
  group: generated-files
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the JSON and the article pages
        run: |
          ruby scripts/build-blog-index.rb
          ruby scripts/build-content-json.rb
          ruby scripts/build-share-pages.rb
          ruby scripts/build-search-index.rb
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data blog
          if git diff --cached --quiet; then
            echo "The generated files already match the sources; nothing to commit."
          else
            git commit -m "(auto) generate the content JSON and the article pages from the YAML sources"
            # A push that lands while this runs moves main under the files just
            # built, and a rebase would carry them onto a commit they were not
            # built from. They are built again on the tip instead, and that goes
            # into the same commit.
            git pull --rebase origin main
            ruby scripts/build-blog-index.rb
            ruby scripts/build-content-json.rb
            ruby scripts/build-share-pages.rb
            ruby scripts/build-search-index.rb
            git add -A data blog
            git commit --amend --no-edit
            git push
          fi
